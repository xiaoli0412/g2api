<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;font-family:'Segoe UI',sans-serif;background:#1a1d27;color:#e4e7ec;padding:16px}
h1{font-size:14px;margin-bottom:12px;color:#818cf8}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid #2d3244}
.label{color:#8b92a8}
.value{font-weight:600}
.ok{color:#22c55e}
.err{color:#ef4444}
.off{color:#6b7280}
.warn{color:#f59e0b}
input{width:100%;padding:6px 8px;background:#242836;border:1px solid #2d3244;border-radius:6px;color:#e4e7ec;font-size:12px;margin-top:4px}
button{width:100%;padding:8px;background:#6366f1;color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
button:hover{background:#818cf8}
button:active{transform:scale(0.98)}
.mt{margin-top:12px}
</style>
</head>
<body>
<h1>Gemini Cookie Pusher</h1>
<div class="row"><span class="label">Status</span><span class="value" id="status">--</span></div>
<div class="row"><span class="label">Last Push</span><span class="value" id="lastTime">--</span></div>
<div class="mt">
<label class="label">Server URL</label>
<input type="text" id="serverUrl" placeholder="http://127.0.0.1:8081">
</div>
<button id="pushBtn">Push Now</button>
<script src="popup.js"></script>
</body>
</html>
