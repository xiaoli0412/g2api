<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Cookie Pusher</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 360px;
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #1a1a2e;
  color: #eaeaea;
  padding: 16px;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #2d2d44;
}

.header img {
  width: 32px;
  height: 32px;
}

.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #818cf8;
}

.card {
  background: #16162a;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}

.card-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #6b7280;
  margin-bottom: 8px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
}

.row + .row {
  border-top: 1px solid #1f1f3a;
}

.label {
  color: #9ca3af;
}

.value {
  font-weight: 600;
}

.status-ok { color: #34d399; }
.status-warn { color: #fbbf24; }
.status-err { color: #f87171; }
.status-off { color: #6b7280; }

.input-group {
  margin-bottom: 12px;
}

.input-group label {
  display: block;
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 4px;
}

.input-group input {
  width: 100%;
  padding: 8px 10px;
  background: #1a1a2e;
  border: 1px solid #2d2d44;
  border-radius: 6px;
  color: #eaeaea;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.input-group input:focus {
  border-color: #6366f1;
}

.btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: #6366f1;
  color: white;
}

.btn-primary:hover {
  background: #818cf8;
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-secondary {
  background: #2d2d44;
  color: #eaeaea;
  margin-top: 8px;
}

.btn-secondary:hover {
  background: #3d3d54;
}

.footer {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #2d2d44;
  font-size: 11px;
  color: #6b7280;
  text-align: center;
}

.footer a {
  color: #818cf8;
  text-decoration: none;
}

.cookie-list {
  max-height: 120px;
  overflow-y: auto;
  margin-top: 8px;
}

.cookie-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 11px;
  border-bottom: 1px solid #1f1f3a;
}

.cookie-name {
  color: #818cf8;
  font-family: monospace;
}

.cookie-status {
  color: #34d399;
}

.cookie-missing {
  color: #f87171;
}

.spinner {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid #ffffff40;
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="header">
  <img src="icons/icon32.png" alt="Logo">
  <h1>Gemini Cookie Pusher</h1>
</div>

<div class="card">
  <div class="card-title">Connection Status</div>
  <div class="row">
    <span class="label">Server</span>
    <span class="value" id="status">--</span>
  </div>
  <div class="row">
    <span class="label">Last Push</span>
    <span class="value" id="lastTime">--</span>
  </div>
  <div class="row">
    <span class="label">Cookies</span>
    <span class="value" id="cookieCount">--</span>
  </div>
</div>

<div class="card">
  <div class="card-title">Required Cookies</div>
  <div class="cookie-list" id="cookieList">
    <div class="cookie-item">
      <span class="cookie-name">SID</span>
      <span id="cookie-SID" class="cookie-missing">Missing</span>
    </div>
    <div class="cookie-item">
      <span class="cookie-name">HSID</span>
      <span id="cookie-HSID" class="cookie-missing">Missing</span>
    </div>
    <div class="cookie-item">
      <span class="cookie-name">SSID</span>
      <span id="cookie-SSID" class="cookie-missing">Missing</span>
    </div>
    <div class="cookie-item">
      <span class="cookie-name">APISID</span>
      <span id="cookie-APISID" class="cookie-missing">Missing</span>
    </div>
    <div class="cookie-item">
      <span class="cookie-name">SAPISID</span>
      <span id="cookie-SAPISID" class="cookie-missing">Missing</span>
    </div>
    <div class="cookie-item">
      <span class="cookie-name">__Secure-1PSID</span>
      <span id="cookie-__Secure-1PSID" class="cookie-missing">Missing</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">Server Configuration</div>
  <div class="input-group">
    <label>API Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8081">
  </div>
</div>

<button class="btn btn-primary" id="pushBtn">Push Cookies Now</button>
<button class="btn btn-secondary" id="refreshBtn">Check Cookies</button>

<div class="footer">
  Gemini2API Cookie Extension v1.0
</div>

<script src="popup.js"></script>
</body>
</html>
