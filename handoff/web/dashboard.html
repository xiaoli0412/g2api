<html lang="en">
<head>

<style>

.form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-height:32px;background:#10151a;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:0}input[type="range"]{accent-color:var(--cyan)}textarea{resize:vertical;min-height:124px;font-family:"Cascadia Mono","Consolas",monospace;font-size:12px}input:focus,select:focus,textarea:focus{border-color:#34758c;box-shadow:0 0 0 3px rgba(76,201,240,.1)}

.detail.open{transform:translateX(0)}.detail-head{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:0}.detail-head-main{min-width:0;display:grid;gap:7px;overflow:hidden}.detail-head h3{margin:0;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-ticker{color:var(--green);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-ticker.ops{color:var(--muted);white-space:normal;overflow-wrap:anywhere}.detail-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.detail-chip{min-width:0;border:1px solid var(--line2);border-radius:6px;background:#10151a;padding:6px 8px}.detail-chip span{display:block;color:var(--muted);font-size:10px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-chip strong{display:block;margin-top:3px;font-size:12px;line-height:1.1;color:#dce5ea;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-body{min-height:0;overflow:auto;padding:14px;display:grid;gap:12px}.codebox{background:#07090b;border:1px solid var(--line);border-radius:7px;padding:10px;min-height:160px;max-height:46vh;overflow:auto;white-space:pre;color:#dce5ea}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">✦</div><div><h1>Gemini2API</h1><p data-i18n="brandSub">Operations console</p></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync-line"><span data-i18n="liveStatus">Live status</span><i class="pulse" id="pulse"></i></div>
      <div class="sync-line"><span data-i18n="lastSync">Last sync</span><span id="syncAge">--</span></div>
      <div class="sync-line"><span data-i18n="cadence">Cadence</span><span>1s</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="title"><h2 id="pageTitle"></h2><p id="pageSub"></p></div>
      <div class="top-actions">
        <div class="lang"><button id="langEn" data-lang="en">EN</button><button id="langZh" data-lang="zh">中文</button></div>
        <button class="iconbtn" id="refreshBtn">↻</button>
      </div>
    </header>
    <section class="workspace">
      <div class="metrics" id="metrics"></div>
      <div id="panels"></div>
    </section>
  </main>
</div>

<aside class="detail" id="detail">
  <div class="detail-head"><button class="iconbtn" id="closeDetail">×</button><div class="detail-head-main"><h3 id="detailTitle"></h3><div class="muted mono" id="detailMeta"></div><div class="detail-metrics" id="detailMetrics"></div><div class="detail-ticker ops mono" id="detailOpsTicker"></div></div></div>
  <div class="detail-body">
    <div class="box"><div class="box-head"><h3 data-i18n="requestBody">Request body</h3></div><div class="box-body"><pre class="codebox" id="requestBody"></pre></div></div>
    <div class="box"><div class="box-head"><h3 data-i18n="responseBody">Response body</h3></div><div class="box-body"><pre class="codebox" id="responseBody"></pre></div></div>
    <div class="box"><div class="box-head"><h3 data-i18n="traceBody">Trace</h3></div><div class="box-body"><pre class="codebox" id="traceBody"></pre></div></div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
const API = location.protocol === "file:" ? "http://127.0.0.1:8081" : "";

  lang: localStorage.getItem("lang") || "en",

  visualImage: localStorage.getItem("visualImage") || "",

  en: {

    settings:"Settings", settingsSub:"Runtime and API controls",
    totalRequests:"Total requests", successRate:"Success rate", totalTokens:"Total tokens", errors:"Errors", avgLatency:"Avg latency", rpm:"Req/min",
    peak:"Peak", latest:"Latest", change:"Change", rangeTotal:"Range total", requestVolume:"Request volume", avgPerReq:"Avg/req", usageTrend:"Usage trend", quota:"Quota", tpm:"Tok/min", topBuckets:"Top buckets",
    prompt:"Input", completion:"Output", modelCategory:"Category", uptime:"Uptime", status:"Status", model:"Model", time:"Time", endpoint:"Endpoint", duration:"Duration", stream:"Stream", protocol:"Protocol", method:"Method",
    recentRequests:"Recent requests", recentLogs:"Recent logs", modelUsage:"Model usage", hourly:"Hourly tokens", daily:"Daily tokens",
    operationTotals:"Operation totals", requestBody:"Request body", responseBody:"Response body", traceBody:"Trace / tools", noData:"No data yet", open:"Open", ok:"OK", error:"Error", running:"Running", offline:"Offline", refresh:"Refresh",
    all:"All", bodies:"Bodies", failures:"Failures", importCookie:"Import cookie", importFile:"Import file", rawCookie:"Cookie header, HAR, Netscape, or JSON export",

function drawChart(id,items,alt){

  if(!rows.length){ setHTML(id,`<div class="empty">${t("noData")}</div>`); return; }

  const volumes=rows.map(i=>Number(i.requests||0));

  const hasPrevious=rows.length>1;
  const previous=hasPrevious?values[values.length-2]:last;
  const delta=hasPrevious?last-previous:0;
  const deltaClass=delta>0?"up":delta<0?"down":"flat";
  const deltaPct=previous?` ${(delta/previous*100).toFixed(1)}%`:"";
  const deltaText=hasPrevious?`${delta>0?"+":delta<0?"-":""}${num(Math.abs(delta))}${deltaPct}`:"--";

  const avgPerRequest=requestTotal?total/requestTotal:0;
  const max=Math.max(1,...values);
  const tableRows=rows.map((item,i)=>{
    const share=Math.max(2,(values[i]/max)*100);
    const active=i===rows.length-1?" active":"";
    return `<tr><td class="mono">${esc(labelOf(item))}</td><td class="num">${esc(num(volumes[i]))}</td><td class="num">${esc(num(values[i]))}</td><td><span class="quota-share"><span class="quota-bars"><i class="quota-bar${active}" style="width:${share.toFixed(2)}%"></i></span><span class="mono muted">${share.toFixed(0)}%</span></span></td></tr>`;
  }).join("");
  const periodName=alt?t("daily"):t("hourly");
  const leaders=rows.map((item,i)=>({label:labelOf(item),tokens:values[i],requests:volumes[i]})).sort((a,b)=>b.tokens-a.tokens).slice(0,3);
  const leadersHtml=leaders.map(item=>`<div class="quota-leader"><span>${esc(item.label)}</span><strong class="mono">${esc(num(item.tokens))}</strong><span class="quota-meter"><i style="width:${Math.max(4,(item.tokens/max)*100).toFixed(2)}%"></i></span></div>`).join("");
  const rateLabel=alt?t("peak"):t("tpm");
  const rateValue=alt?max:last/60;
  setHTML(id,`
    <div class="quota-head">
      <div class="quota-cards">
        <div class="quota-mini primary"><span>${esc(t("latest"))}</span><strong>${esc(num(last))}</strong></div>
        <div class="quota-mini"><span>${esc(t("rangeTotal"))}</span><strong>${esc(num(total))}</strong></div>
        <div class="quota-mini"><span>${esc(rateLabel)}</span><strong>${esc(num(rateValue))}</strong></div>
        <div class="quota-mini"><span>${esc(t("requestVolume"))}</span><strong>${esc(num(requestTotal))}</strong></div>
        <div class="quota-mini"><span>${esc(t("avgPerReq"))}</span><strong>${esc(num(avgPerRequest))}</strong></div>
        <div class="quota-mini delta ${deltaClass}"><span>${esc(t("change"))}</span><strong>${esc(deltaText)}</strong></div>
      </div>
    </div>
    <div class="quota-tabs"><span class="active">${esc(t("usageTrend"))}</span><span>${esc(t("requestVolume"))}</span><span>${esc(t("topBuckets"))}</span></div>
    <div class="quota-body">
      <div class="quota-table-card">
        <table class="quota-table" aria-label="${esc(periodName)}">
          <thead><tr><th>${esc(t("time"))}</th><th class="num">${esc(t("requestVolume"))}</th><th class="num">${esc(t("totalTokens"))}</th><th>${esc(t("quota"))}</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      <div class="quota-leaders"><div class="quota-leaders-title">${esc(t("topBuckets"))}</div>${leadersHtml}</div>
    </div>`);
}
